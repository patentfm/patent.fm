<!DOCTYPE html>
<html lang="pl">
<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="{{page.meta-description}}">
    <meta name="keywords" content="{{page.meta-keywords}}">
    <title>Fajny Materiał - {{page.title}}</title>
    {% include favicon.html %}
    <!-- Font -->
    <link href="https://fonts.googleapis.com/css?family=Roboto:100,300,400,500,700,900" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="vendors/fontawesome/css/font-awesome.min.css">
    <!-- Simple Line Font -->
    <link rel="stylesheet" href="vendors/simple-line-icons/css/simple-line-icons.css">
    <!-- Pe-icon Font -->
    <link rel="stylesheet" href="vendors/pe-icon/css/helper.css">
    <link rel="stylesheet" href="vendors/pe-icon/css/pe-icon-7-stroke.css">
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="vendors/bootstrap/css/bootstrap.min.css">
    <!-- Main css -->
    <link href="css/style.css" rel="stylesheet">
    <style>
        h2 {
            padding-top: 100px;
            font-size: 32px;
            color: #ffffff!important;
        }
        #blogContents ul{
            padding-left: 0;
            list-style: none;
        }
        #blogContents li{
            padding-bottom: 10px;
        }
        #blogContents a{
            color: #11aff1;
        }
    </style>
</head>
<body class="dark-theme">
<!--===================== Header =====================-->
{% include navmenu.html %}
<!--//End Header -->
<!--===================== Blog =====================-->
<section class="blog">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 center-block">
                <h1 class="blog-title">{{page.subheader}}</h1>
            </div>
        </div>
        <div class="row">
            <div class="col-md-8">
                <div class="blog-wrap">
                    <div class="blog-img-wrap">
                        <img src="images/blog-img1.jpg" class="img-fluid mb-3" alt="#">
                      {{content}}
                    </div>
                </div>
            </div>
            <div class="col-md-4 xs-mt-2 d-none" id="blogContentsColumn">

                <div class="recent-post">
                    <h3 class="mt-1">Spis zawartości</h3>
                    <div id="blogContents">

                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
<!--//End Blog -->
{% include contact-form.html %}
{% include footer.html %}
{% include cookies.html %}

{% include basic-js-vendors.html %}
{% include basic-js.html %}
<script type="text/javascript">
    var element = document.getElementById('blogContentsColumn');
    element.classList.remove('d-none');
    var blogElement = document.getElementById('blogContents');
    blogElement.appendChild(document.getElementById('markdown-toc'));
</script>

</body>
</html>
