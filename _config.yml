# =============================================================
#  patent.fm — konfiguracja Jekylla
#  Koncepcja i model działania: docs/koncepcja.md
#  Jak dodawać treść: docs/strona.md
# =============================================================

title: patent.fm
tagline: Co tydzień jedna aplikacja
description: >-
  Co tydzień biorę jeden pomysł i robię z niego działającą aplikację — od zera do wdrożenia.
  Każdy odcinek kończy się reklamą, której nikt nie zamawiał. Kto chce robić tak samo,
  znajdzie tu kursy i materiały.
url: "https://patent.fm"
baseurl: ""
jezyk: pl

# Podbij przy wydaniu — służy do unieważniania cache CSS/JS
version: 400

# --- Autor / firma ------------------------------------------------
email: wrzosdev@gmail.com

# --- Treść --------------------------------------------------------
collections:
  odcinki:
    output: true
    permalink: /odcinki/:name/
  kursy:
    output: true
    permalink: /kursy/:name/
  lekcje:
    output: true
    permalink: /kursy/:path/
  materialy:
    output: true
    permalink: /materialy/:name/

defaults:
  - scope:
      path: ""
      type: odcinki
    values:
      layout: odcinek
  - scope:
      path: ""
      type: kursy
    values:
      layout: kurs
  - scope:
      path: ""
      type: lekcje
    values:
      layout: lekcja
  - scope:
      path: ""
      type: materialy
    values:
      layout: material
  - scope:
      path: ""
    values:
      layout: strona

# --- Budowanie ----------------------------------------------------
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
sass:
  style: compressed

exclude:
  - docs/
  - backup/
  - endpoint/
  - readme.md
  - start.sh
  - refreshandpush.sh
  - Gemfile
  - Gemfile.lock
  # Pozostałości po starym szablonie (Mobland). Nie są już używane przez żaden
  # layout — nie publikujemy ich, żeby nie puchła strona. Do usunięcia po sezonie 1.
  - vendors/
  - scss/
  - js/contact.js
  - css/style.css
  - css/style.css.map
